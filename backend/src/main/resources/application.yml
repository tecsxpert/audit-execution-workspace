server:
  error:
    include-message: always

spring:
  data:
    redis:
      repositories:
        enabled: false

  datasource:
    url: jdbc:postgresql://localhost:5433/auditdb
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: false
  redis:
    host: localhost
    port: 6379

# Must be top-level (not under spring:). Enable with true or APP_SCHEDULER_ENABLED=true
app:
  scheduler:
    enabled: ${APP_SCHEDULER_ENABLED:false}
