version: '3.8'

services:

  postgres:
    image: postgres:16-alpine
    container_name: audit-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auditdb
    ports:
      - "5433:5432"   # host:container
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:latest
    container_name: audit-redis
    ports:
      - "6379:6379"

volumes:
  pgdata: